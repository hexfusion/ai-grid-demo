<svg xmlns="http://www.w3.org/2000/svg" width="966" height="384" viewBox="0 0 966 384" font-family="'Red Hat Text', Helvetica, Arial, sans-serif">
<rect width="966" height="384" fill="#FFFFFF"/>
<defs><marker id="sl" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8A8A8A"/></marker>
<marker id="grn" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E9E5B"/></marker></defs>
<rect x="24" y="20" width="520" height="304" rx="6" fill="#F5F5F5" stroke="#7B45C6" stroke-width="2"/>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="40" y="46" font-size="16" font-weight="700" fill="#151515">Grid gateway picks the site</text>
<text x="40" y="66" font-size="12.5" fill="#4D4D4D">every request, from load each site reported seconds ago</text>
<rect x="40" y="82" width="488" height="38" rx="6" fill="#FFFFFF" stroke="#7B45C6" stroke-width="1.6"/>
<circle cx="60" cy="101" r="10" fill="#7B45C6"/><text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="60" y="105.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="80" y="106" font-size="14" font-weight="700" fill="#151515">Model</text>
<text x="516" y="106" font-size="12.5" fill="#4D4D4D" text-anchor="end">only sites that serve it</text>
<rect x="40" y="128" width="488" height="38" rx="6" fill="#FFFFFF" stroke="#7B45C6" stroke-width="1.6"/>
<circle cx="60" cy="147" r="10" fill="#7B45C6"/><text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="60" y="151.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="80" y="152" font-size="14" font-weight="700" fill="#151515">Healthy</text>
<text x="516" y="152" font-size="12.5" fill="#4D4D4D" text-anchor="end">at least one ready server</text>
<rect x="40" y="174" width="488" height="38" rx="6" fill="#FFFFFF" stroke="#7B45C6" stroke-width="1.6"/>
<circle cx="60" cy="193" r="10" fill="#7B45C6"/><text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="60" y="197.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="80" y="198" font-size="14" font-weight="700" fill="#151515">Affinity</text>
<text x="516" y="198" font-size="12.5" fill="#4D4D4D" text-anchor="end">prefer where this prompt went before</text>
<rect x="40" y="220" width="488" height="38" rx="6" fill="#FFFFFF" stroke="#7B45C6" stroke-width="1.6"/>
<circle cx="60" cy="239" r="10" fill="#7B45C6"/><text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="60" y="243.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="80" y="244" font-size="14" font-weight="700" fill="#151515">Room</text>
<text x="516" y="244" font-size="12.5" fill="#4D4D4D" text-anchor="end">in-flight below its learned ceiling</text>
<rect x="40" y="266" width="488" height="38" rx="6" fill="#FFFFFF" stroke="#7B45C6" stroke-width="1.6"/>
<circle cx="60" cy="285" r="10" fill="#7B45C6"/><text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="60" y="289.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="80" y="290" font-size="14" font-weight="700" fill="#151515">Two choices</text>
<text x="516" y="290" font-size="12.5" fill="#4D4D4D" text-anchor="end">the less saturated site wins</text>
<text x="40" y="340" font-size="12.5" fill="#C27C0E">No site with room: the least full site takes it.&#160;&#160;&#160;No healthy site: 503.</text>
<line x1="548" y1="137" x2="600" y2="137" stroke="#2E9E5B" stroke-width="2" marker-end="url(#grn)"/>
<rect x="606" y="20" width="336" height="234" rx="6" fill="#F5F5F5" stroke="#3D6FB6" stroke-width="2"/>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="622" y="46" font-size="16" font-weight="700" fill="#151515">Site EPP picks the server</text>
<text x="622" y="66" font-size="12.5" fill="#4D4D4D">inside the chosen site, per request</text>
<rect x="622" y="82" width="304" height="38" rx="6" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="1.6"/>
<circle cx="642" cy="101" r="10" fill="#3D6FB6"/><text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="642" y="105.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="662" y="106" font-size="14" font-weight="700" fill="#151515">Prefix cache</text>
<text x="914" y="106" font-size="12.5" fill="#4D4D4D" text-anchor="end">holds the prompt</text>
<rect x="622" y="128" width="304" height="38" rx="6" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="1.6"/>
<circle cx="642" cy="147" r="10" fill="#3D6FB6"/><text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="642" y="151.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="662" y="152" font-size="14" font-weight="700" fill="#151515">Load</text>
<text x="914" y="152" font-size="12.5" fill="#4D4D4D" text-anchor="end">queue and KV cache</text>
<rect x="622" y="174" width="304" height="38" rx="6" fill="#FFFFFF" stroke="#3D6FB6" stroke-width="1.6"/>
<circle cx="642" cy="193" r="10" fill="#3D6FB6"/><text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="642" y="197.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="662" y="198" font-size="14" font-weight="700" fill="#151515">Prefill / decode</text>
<text x="914" y="198" font-size="12.5" fill="#4D4D4D" text-anchor="end">split when it pays</text>
<text x="24" y="368" font-size="13" fill="#4D4D4D">The gateway never looks anything up per request. Load arrives every few seconds and the pick is made locally.</text>
</svg>