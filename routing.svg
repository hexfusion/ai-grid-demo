<svg xmlns="http://www.w3.org/2000/svg" width="966" height="384" viewBox="0 0 966 384" font-family="'Red Hat Text', Helvetica, Arial, sans-serif">
<rect width="966" height="384" fill="#1F1F1F"/>
<defs><marker id="sl" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9A9AA8"/></marker>
<marker id="grn" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3DDC84"/></marker></defs>
<rect x="24" y="20" width="520" height="304" rx="6" fill="#22222C" stroke="#A06EE0" stroke-width="2"/>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="40" y="46" font-size="16" font-weight="700" fill="#FFFFFF">Grid gateway picks the site</text>
<text x="40" y="66" font-size="12.5" fill="#C9C9C9">every request, from load each site reported seconds ago</text>
<rect x="40" y="82" width="488" height="38" rx="6" fill="#1A1A22" stroke="#A06EE0" stroke-width="1.2"/>
<circle cx="60" cy="101" r="10" fill="#A06EE0"/><text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="60" y="105.5" font-size="12" font-weight="700" fill="#1F1F1F" text-anchor="middle">1</text>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="80" y="106" font-size="14" font-weight="700" fill="#FFFFFF">Model</text>
<text x="516" y="106" font-size="12.5" fill="#C9C9C9" text-anchor="end">only sites that serve it</text>
<rect x="40" y="128" width="488" height="38" rx="6" fill="#1A1A22" stroke="#A06EE0" stroke-width="1.2"/>
<circle cx="60" cy="147" r="10" fill="#A06EE0"/><text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="60" y="151.5" font-size="12" font-weight="700" fill="#1F1F1F" text-anchor="middle">2</text>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="80" y="152" font-size="14" font-weight="700" fill="#FFFFFF">Healthy</text>
<text x="516" y="152" font-size="12.5" fill="#C9C9C9" text-anchor="end">at least one ready server</text>
<rect x="40" y="174" width="488" height="38" rx="6" fill="#1A1A22" stroke="#A06EE0" stroke-width="1.2"/>
<circle cx="60" cy="193" r="10" fill="#A06EE0"/><text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="60" y="197.5" font-size="12" font-weight="700" fill="#1F1F1F" text-anchor="middle">3</text>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="80" y="198" font-size="14" font-weight="700" fill="#FFFFFF">Affinity</text>
<text x="516" y="198" font-size="12.5" fill="#C9C9C9" text-anchor="end">prefer where this prompt went before</text>
<rect x="40" y="220" width="488" height="38" rx="6" fill="#1A1A22" stroke="#A06EE0" stroke-width="1.2"/>
<circle cx="60" cy="239" r="10" fill="#A06EE0"/><text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="60" y="243.5" font-size="12" font-weight="700" fill="#1F1F1F" text-anchor="middle">4</text>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="80" y="244" font-size="14" font-weight="700" fill="#FFFFFF">Room</text>
<text x="516" y="244" font-size="12.5" fill="#C9C9C9" text-anchor="end">in-flight below its learned ceiling</text>
<rect x="40" y="266" width="488" height="38" rx="6" fill="#1A1A22" stroke="#A06EE0" stroke-width="1.2"/>
<circle cx="60" cy="285" r="10" fill="#A06EE0"/><text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="60" y="289.5" font-size="12" font-weight="700" fill="#1F1F1F" text-anchor="middle">5</text>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="80" y="290" font-size="14" font-weight="700" fill="#FFFFFF">Two choices</text>
<text x="516" y="290" font-size="12.5" fill="#C9C9C9" text-anchor="end">the less saturated site wins</text>
<text x="40" y="340" font-size="12.5" fill="#E6A53D">No site with room: the least full site takes it.&#160;&#160;&#160;No healthy site: 503.</text>
<line x1="548" y1="137" x2="600" y2="137" stroke="#3DDC84" stroke-width="2" marker-end="url(#grn)"/>
<rect x="606" y="20" width="336" height="234" rx="6" fill="#22222C" stroke="#6F9AD6" stroke-width="2"/>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="622" y="46" font-size="16" font-weight="700" fill="#FFFFFF">Site EPP picks the server</text>
<text x="622" y="66" font-size="12.5" fill="#C9C9C9">inside the chosen site, per request</text>
<rect x="622" y="82" width="304" height="38" rx="6" fill="#1A1A22" stroke="#6F9AD6" stroke-width="1.2"/>
<circle cx="642" cy="101" r="10" fill="#6F9AD6"/><text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="642" y="105.5" font-size="12" font-weight="700" fill="#1F1F1F" text-anchor="middle">1</text>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="662" y="106" font-size="14" font-weight="700" fill="#FFFFFF">Prefix cache</text>
<text x="914" y="106" font-size="12.5" fill="#C9C9C9" text-anchor="end">holds the prompt</text>
<rect x="622" y="128" width="304" height="38" rx="6" fill="#1A1A22" stroke="#6F9AD6" stroke-width="1.2"/>
<circle cx="642" cy="147" r="10" fill="#6F9AD6"/><text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="642" y="151.5" font-size="12" font-weight="700" fill="#1F1F1F" text-anchor="middle">2</text>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="662" y="152" font-size="14" font-weight="700" fill="#FFFFFF">Load</text>
<text x="914" y="152" font-size="12.5" fill="#C9C9C9" text-anchor="end">queue and KV cache</text>
<rect x="622" y="174" width="304" height="38" rx="6" fill="#1A1A22" stroke="#6F9AD6" stroke-width="1.2"/>
<circle cx="642" cy="193" r="10" fill="#6F9AD6"/><text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="642" y="197.5" font-size="12" font-weight="700" fill="#1F1F1F" text-anchor="middle">3</text>
<text font-family="'Red Hat Display', Helvetica, Arial, sans-serif" x="662" y="198" font-size="14" font-weight="700" fill="#FFFFFF">Prefill / decode</text>
<text x="914" y="198" font-size="12.5" fill="#C9C9C9" text-anchor="end">split when it pays</text>
<text x="24" y="368" font-size="13" fill="#C9C9C9">The gateway never looks anything up per request. Load arrives every few seconds and the pick is made locally.</text>
</svg>